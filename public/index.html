<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Olga's Cheese Kiosk</title>
<meta name="description" content="Olga's Cheese self-service desk: order, pay by card, automatic receipt, sign the paper form.">
<meta name="theme-color" content="#f6f1e6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Olga's Cheese — self-service kiosk (browser demo)
   One file on purpose: open it in Chrome on the kiosk tablet and it runs.
   ========================================================================== */
:root{
  --green:#2a8f33;        /* sampled from the logo lettering */
  --green-700:#1d6b25;
  --green-100:#d3ead0;
  --green-50:#ebf6e9;
  --cheese:#f5c542;
  --cheese-200:#fbe39a;
  --cheese-50:#fff8de;
  --cheese-ink:#4a3a00;
  --ink:#1c1915;          /* the cow */
  --ink-2:#4b453d;
  --muted:#71685d;
  --line:#e7dfcf;
  --canvas:#f6f1e6;
  --card:#ffffff;
  --red:#b3261e;
  --red-50:#fdecea;
  --shadow:0 1px 0 rgba(28,25,21,.04),0 10px 28px -14px rgba(28,25,21,.22);
  --font-display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 18px/1.45 var(--font);
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--cheese);outline-offset:3px}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;animation:screen-in .32s cubic-bezier(.2,.8,.2,1)}
@keyframes screen-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;min-height:64px;padding:0 28px;
  border-radius:999px;font-weight:800;font-size:20px;letter-spacing:-.005em;line-height:1.1;text-align:center;
  transition:transform .12s ease,background-color .15s ease,box-shadow .15s ease}
.btn:active{transform:scale(.97)}
.btn .ic{width:24px;height:24px;stroke-width:2.4}
.btn-primary{background:var(--green);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.btn-primary:active{box-shadow:inset 0 -1px 0 rgba(0,0,0,.2)}
.btn-dark{background:var(--ink);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
.btn-secondary{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn-danger{background:#fff;color:var(--red);box-shadow:inset 0 0 0 2px #f1c9c5}
.btn-lg{min-height:78px;font-size:24px;padding:0 36px}
.btn-lg .ic{width:28px;height:28px}
.btn-sm{min-height:52px;font-size:17px;padding:0 20px}
.btn-block{width:100%}
.btn[disabled]{background:#ddd5c6;color:#857b6e;box-shadow:none;cursor:default;transform:none}

/* ---------- Top bar ---------- */
.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:8px 18px;
  background:#fff;border-bottom:1px solid var(--line);min-height:78px;position:relative;z-index:2}
.logo-btn{display:block;border-radius:12px}
.topbar-logo{height:58px;width:auto}
.steps{display:flex;justify-content:center;align-items:center;gap:6px;list-style:none;margin:0;padding:0}
.step{display:flex;align-items:center;gap:10px;padding:7px 16px 7px 7px;border-radius:999px;color:var(--muted);font-weight:700;font-size:16px;white-space:nowrap}
.step-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--canvas);font-weight:800;font-size:15px;color:var(--ink-2)}
.step-n .ic{width:18px;height:18px;stroke-width:3}
.step.is-active{background:var(--green-50);color:var(--green-700)}
.step.is-active .step-n{background:var(--green);color:#fff}
.step.is-done{color:var(--green-700)}
.step.is-done .step-n{background:var(--green-100);color:var(--green-700)}
.step-sep{width:22px;height:2px;background:var(--line);border-radius:2px}
.topbar-right{display:flex;align-items:center;gap:10px}
.demo-btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;
  background:var(--canvas);color:var(--ink-2);font-size:14px;font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.topbar .btn{white-space:nowrap}
.demo-btn .dot{width:9px;height:9px;border-radius:50%;background:#c9bfae}
.demo-btn .dot.on{background:var(--green)}
@media (max-width:900px){
  .step:not(.is-active) .step-label{display:none}
  .step{padding:5px}.step.is-active{padding-right:14px}
  .step-sep{width:10px}
  .topbar{gap:10px;padding:8px 12px;min-height:68px}
  .topbar-logo{height:46px}
}
@media (max-width:620px){
  .topbar{grid-template-columns:auto 1fr auto}
  .steps{justify-content:flex-start}
  .step.is-active .step-label{font-size:14px}
  .demo-btn span{display:none}
  .topbar .btn-sm{padding:0 14px;font-size:15px;min-height:46px}
}
@media (max-width:520px){
  .step.is-active .step-label{display:none}
  .step.is-active{padding-right:5px}
  .step-sep{width:6px}
  .topbar-logo{height:40px}
}

/* ---------- Welcome ---------- */
.welcome{flex:1;position:relative;overflow-x:hidden;overflow-y:auto;cursor:pointer}
.welcome-inner{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:28px 24px 28px}
.welcome-stack{margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center}
.spots{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spots svg{position:absolute;fill:var(--ink)}
.spot-a{width:300px;left:-110px;top:-90px}
.spot-b{width:360px;right:-150px;bottom:-140px}
.spot-c{width:120px;right:7%;top:9%;opacity:.95}
.spot-d{width:90px;left:6%;bottom:12%}
.welcome-logo{width:min(500px,80vw,calc(24vh * 1.56));height:auto;margin:0 auto}
.welcome h1{font:800 clamp(40px,min(6.6vw,7.8vh),86px)/.98 var(--font-display);letter-spacing:-.035em;margin-top:14px}
.welcome h1 em{font-style:normal;color:var(--green)}
.welcome .lead{max-width:720px;margin:14px auto 0;font-size:clamp(18px,2.1vw,23px);color:var(--ink-2)}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;list-style:none;padding:0;margin:26px auto 0;max-width:900px;width:100%}
.howto li{background:#fff;border-radius:24px;padding:16px 18px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.howto .hi{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;background:var(--green-50);color:var(--green-700);margin-bottom:4px}
.howto .hi .ic{width:34px;height:34px}
.howto li:nth-child(3) .hi{background:var(--cheese-50);color:#8a6a00}
.howto .n{position:absolute;top:14px;left:16px;font:800 15px var(--font);color:var(--muted)}
.howto li>div{display:flex;flex-direction:column;gap:4px}
.howto b{font-size:20px;line-height:1.2}
.howto span{font-size:16px;color:var(--muted);line-height:1.35}
.cta{margin-top:26px;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.fine{margin-top:18px;color:var(--ink-2);font-weight:700;font-size:17px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.fine .ic{width:24px;height:24px}
.welcome-demo{position:absolute;top:16px;right:16px;z-index:3}
.staff-hotspot{position:absolute;left:0;top:0;width:84px;height:84px;z-index:3}
@media (max-width:700px){
  .howto{grid-template-columns:1fr;gap:10px}
  .howto li{flex-direction:row;text-align:left;align-items:center;padding:14px 16px;gap:14px}
  .howto .hi{margin:0;width:56px;height:56px}
  .howto .n{display:none}
  .howto li>div{display:flex;flex-direction:column}
  .spot-a{width:150px;left:-80px;top:-70px}.spot-b{width:220px;right:-120px;bottom:-120px}.spot-c,.spot-d{display:none}
}

/* ---------- Menu ---------- */
.menu{flex:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr)}
.rail{overflow:auto;padding:16px 12px 24px;background:#fbf8f1;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-btn{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;border-radius:18px;text-align:left;font-weight:700;font-size:17px;line-height:1.15;color:var(--ink-2);min-height:74px;transition:background-color .15s}
.rail-art{width:58px;height:58px;border-radius:15px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.rail-art svg{width:48px;height:auto}
.rail-btn.is-active{background:#fff;color:var(--ink);box-shadow:var(--shadow),inset 5px 0 0 var(--green)}
.rail-btn.is-active .rail-art{background:var(--tint,#fff);box-shadow:none}
.rail-count{margin-left:auto;min-width:28px;height:28px;border-radius:999px;background:var(--green);color:#fff;font-size:14px;font-weight:800;display:grid;place-items:center;padding:0 8px}
.content{overflow:auto;padding:26px 28px 36px;min-width:0;scroll-behavior:smooth}
.cat-head h2{font:800 40px/1.04 var(--font-display);letter-spacing:-.025em}
.cat-head p{margin-top:6px;color:var(--muted);font-size:18px}
.deal{display:flex;gap:16px;align-items:center;margin-top:18px;padding:14px 20px;border-radius:20px;background:var(--cheese);color:var(--cheese-ink)}
.deal .ic{width:34px;height:34px;flex:none}
.deal b{font-size:19px;display:block}
.deal span{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:22px}
.pcard{background:#fff;border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;overflow:clip;
  outline:3px solid transparent;outline-offset:-3px;transition:outline-color .15s}
.pcard.in-cart{outline-color:var(--green)}
.pcard-main{display:flex;flex-direction:column;text-align:left;padding:12px 12px 0;flex:1}
.pcard-main:active .pcard-art svg{transform:scale(.94)}
.pcard-art{position:relative;aspect-ratio:5/4;border-radius:18px;display:grid;place-items:center;background:var(--tint)}
.pcard-art svg{width:80%;height:auto;transition:transform .15s}
.pcard-badge[hidden]{display:none}
.pcard-badge{position:absolute;top:10px;right:10px;min-width:38px;height:38px;padding:0 10px;border-radius:999px;background:var(--green);color:#fff;font-weight:800;display:grid;place-items:center;font-size:18px;box-shadow:0 0 0 3px #fff}
.pcard-badge.pop{animation:pop .3s}
.pcard-tag{position:absolute;left:10px;top:10px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.pcard-name{font-weight:800;font-size:20px;line-height:1.2;margin:12px 4px 4px;letter-spacing:-.01em}
.pcard-desc{font-size:15px;color:var(--muted);margin:0 4px;line-height:1.35}
.pcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 12px 16px;min-height:84px}
.price{font:800 27px/1 var(--font-display);letter-spacing:-.02em}
.add{width:62px;height:62px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);transition:transform .12s}
.add:active{transform:scale(.92)}
.add .ic{width:30px;height:30px;stroke-width:2.8}
.add .lbl{display:none}
.upsell-grid .pcard-foot{flex-direction:column;align-items:stretch;gap:8px;padding:6px 12px 12px}
.upsell-grid .add{width:100%;height:56px;border-radius:999px;display:flex;gap:6px;justify-content:center;align-items:center}
.upsell-grid .add .lbl{display:inline;font-weight:800;font-size:19px}
.upsell-grid .stepper{justify-content:space-between}
.stepper{display:flex;align-items:center;gap:2px;background:var(--green-50);border-radius:999px;padding:4px}
.stepper button{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--green-700);box-shadow:inset 0 0 0 2px var(--green-100)}
.stepper button:active{transform:scale(.92)}
.stepper button .ic{width:26px;height:26px;stroke-width:2.8}
.stepper button[disabled]{opacity:.4}
.stepper .qty{min-width:36px;text-align:center;font-weight:800;font-size:22px}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1)}}
@media (max-width:900px){
  .menu{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:8px}
  .rail-btn{flex:none;min-height:60px;padding:6px 14px 6px 6px;font-size:16px}
  .rail-art{width:46px;height:46px;border-radius:12px}
  .rail-art svg{width:38px}
  .rail-btn.is-active{box-shadow:var(--shadow),inset 0 -4px 0 var(--green)}
  .content{padding:18px 16px 28px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
  .cat-head h2{font-size:31px}
  .pcard-name{font-size:18px}
  .pcard-foot{flex-direction:column;align-items:stretch;gap:8px;padding:6px 10px 12px;min-height:0}
  .pcard-foot .price{padding-left:4px}
  .price{font-size:23px}
  .add{width:100%;height:54px;border-radius:999px;display:flex;gap:6px;justify-content:center;align-items:center}
  .add .ic{width:26px;height:26px}
  .add .lbl{display:inline;font-weight:800;font-size:18px}
  .pcard-foot .stepper{justify-content:space-between}
  .stepper button{width:46px;height:46px}
  .stepper .qty{min-width:28px;font-size:20px}
}

/* ---------- Order bar ---------- */
.nudge{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 24px;font-weight:700;font-size:17px;line-height:1.25;animation:nudge-in .3s ease-out}
.nudge.hint{background:var(--cheese);color:var(--cheese-ink)}
.nudge.ok{background:var(--green-50);color:var(--green-700)}
.nudge .ic{width:26px;height:26px}
.nudge .btn{margin-left:auto;min-height:48px;font-size:16px;padding:0 18px}
@keyframes nudge-in{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.orderbar{display:flex;align-items:center;gap:18px;padding:14px 18px 14px 22px;background:var(--ink);color:#fff;position:relative;z-index:2}
.bag{position:relative;width:58px;height:58px;border-radius:17px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.bag .ic{width:30px;height:30px}
.bag-count{position:absolute;top:-7px;right:-7px;min-width:27px;height:27px;border-radius:999px;background:var(--cheese);color:var(--cheese-ink);font-weight:800;font-size:14px;display:grid;place-items:center;padding:0 7px}
.bag.bump{animation:pop .35s}
.ob-text{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.ob-title{font-weight:800;font-size:19px}
.ob-sub{color:#cfc7b8;font-size:15px}
.ob-total{margin-left:auto;text-align:right;white-space:nowrap}
.ob-total small{display:block;color:#cfc7b8;font-size:14px;font-weight:600}
.ob-total strong{font:800 34px/1 var(--font-display);letter-spacing:-.02em}
.orderbar .btn{min-height:70px}
.orderbar .btn[disabled]{background:#3a352e;color:#9d9486}
@media (max-width:700px){
  .ob-text{display:none}
  .orderbar{gap:12px;padding:10px 12px}
  .bag{width:50px;height:50px}
  .ob-total strong{font-size:26px}
  .orderbar .btn{padding:0 18px;font-size:18px;min-height:62px}
  .nudge{padding:8px 10px 8px 14px;font-size:15px}
  .nudge .btn{padding:0 14px;font-size:15px;min-height:44px}
}
.flyer{position:fixed;z-index:60;pointer-events:none;will-change:transform,opacity}

/* ---------- Review ---------- */
.review{flex:1;overflow:auto}
.review-inner{max-width:1000px;margin:0 auto;padding:32px 28px 28px}
.h1{font:800 46px/1.02 var(--font-display);letter-spacing:-.025em}
.lead{font-size:20px;color:var(--ink-2);margin-top:10px}
.rlist{margin:24px 0 0;padding:0;list-style:none;background:#fff;border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.rline{display:grid;grid-template-columns:80px minmax(0,1fr) auto 110px 56px;grid-template-areas:"art info stepper total remove";align-items:center;gap:16px;padding:14px 18px;border-top:1px solid var(--line)}
.rline:first-child{border-top:0}
.rline-art{grid-area:art;width:80px;height:66px;border-radius:14px;display:grid;place-items:center;background:var(--tint)}
.rline-art svg{width:62px;height:auto}
.rline-info{grid-area:info;min-width:0}
.rline-name{font-weight:800;font-size:20px;line-height:1.2}
.rline-unit{color:var(--muted);font-size:16px}
.rline .stepper{grid-area:stepper}
.rline-total{grid-area:total;font:800 24px var(--font-display);text-align:right;letter-spacing:-.02em}
.rline-total.free{color:var(--green-700)}
.rline-total s{display:block;font:600 15px var(--font);color:var(--muted)}
.rline .icon-btn{grid-area:remove}
.icon-btn{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--canvas)}
.icon-btn .ic{width:24px;height:24px}
.icon-btn:active{transform:scale(.92)}
.callout{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px 16px 14px 20px;border-radius:20px;background:var(--cheese);color:var(--cheese-ink);font-weight:700}
.callout .ic{width:28px;height:28px}
.callout .btn{margin-left:auto;min-height:50px;font-size:16px}
.sum{margin-top:18px;background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:18px 24px}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;font-size:19px;padding:5px 0;color:var(--ink-2)}
.sum-row.deal-row{color:var(--green-700);font-weight:700}
.sum-row.total{border-top:2px dashed var(--line);margin-top:8px;padding-top:14px;color:var(--ink);font-weight:800;font-size:22px}
.sum-row.charge{font-size:18px;color:var(--ink-2);padding-top:10px}
.sum-row.charge b{font:800 26px var(--font-display);color:var(--ink)}
.fine-sub{margin-top:6px;color:var(--muted);font-size:15px;font-weight:600}
.sum-row.total strong{font:800 46px/1 var(--font-display);letter-spacing:-.03em}
.payfoot{display:flex;gap:16px;align-items:center;padding:14px 24px;background:#fff;border-top:1px solid var(--line)}
.paynote{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:16px;font-weight:600;margin-right:auto}
.paynote .ic{width:26px;height:26px;color:var(--green-700)}
@media (max-width:760px){
  .review-inner{padding:20px 14px 20px}
  .h1{font-size:34px}
  .lead{font-size:17px}
  .rline{grid-template-columns:60px minmax(0,1fr) auto;grid-template-areas:"art info remove" "art stepper total";gap:8px 12px;padding:12px}
  .rline-art{width:60px;height:56px}
  .rline-art svg{width:48px}
  .rline .stepper{justify-self:start}
  .rline-name{font-size:18px}
  .rline-total{font-size:21px}
  .payfoot{flex-direction:column-reverse;align-items:stretch;padding:12px}
  .paynote{margin:0;justify-content:center;font-size:14px}
  .callout{flex-wrap:wrap}
  .callout .btn{margin-left:0;width:100%}
}

/* ---------- Pay ---------- */
.pay{flex:1;overflow:auto}
.pay-inner{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:48px;align-items:center;max-width:1180px;margin:0 auto;padding:28px 40px;min-height:100%}
.reader-stage{position:relative;display:grid;place-items:center;aspect-ratio:1/1.05;max-height:70vh;
  background:radial-gradient(closest-side,#fff 0,#fff 55%,rgba(255,255,255,0) 100%)}
.reader{width:min(100%,360px);height:auto;overflow:visible}
.reader .card{animation:tap 3s cubic-bezier(.45,.05,.3,1) infinite;transform-box:view-box;transform-origin:150px 146px}
.reader .leds circle{fill:#3b3631}
.reader.is-processing .leds circle{animation:led 1.2s infinite}
.reader.is-processing .leds circle:nth-child(2){animation-delay:.15s}
.reader.is-processing .leds circle:nth-child(3){animation-delay:.3s}
.reader.is-processing .leds circle:nth-child(4){animation-delay:.45s}
@keyframes led{0%,100%{fill:#3b3631}40%{fill:#7bd389}}
.reader.is-processing .card{animation:none;transform:translate(0,0)}
.reader .waves path{opacity:0;animation:wave 1.5s ease-out infinite}
.reader .waves path:nth-child(2){animation-delay:.18s}
.reader .waves path:nth-child(3){animation-delay:.36s}
.reader.is-processing .waves path{animation:none;opacity:.25}
.reader .spin{display:none;transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
.reader.is-processing .spin{display:inline}
.reader.is-processing .nfc-on-screen{display:none}
@keyframes tap{0%,8%{transform:translate(62px,96px) rotate(12deg)}42%,66%{transform:translate(0,0) rotate(0)}100%{transform:translate(62px,96px) rotate(12deg)}}
@keyframes wave{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.kicker{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.07em;text-transform:uppercase;color:var(--green-700)}
.kicker .ic{width:20px;height:20px}
.pay h1{font:800 42px/1.02 var(--font-display);letter-spacing:-.025em;margin-top:8px}
.amount-box{margin-top:18px;display:inline-flex;flex-direction:column;background:#fff;border-radius:22px;padding:14px 26px 16px;box-shadow:var(--shadow)}
.amount-box small{font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.amount{font:800 70px/1 var(--font-display);letter-spacing:-.035em;margin-top:4px}
.steps-list{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:12px}
.steps-list li{display:flex;gap:14px;align-items:center;font-size:20px;line-height:1.3;font-weight:600}
.steps-list .num{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;font-size:18px}
.status{display:flex;align-items:center;gap:14px;margin-top:20px;padding:16px 20px;border-radius:18px;background:#fff;box-shadow:var(--shadow);font-weight:800;font-size:20px}
.status .dot{width:16px;height:16px;border-radius:50%;background:var(--cheese);flex:none;animation:ping 1.6s ease-out infinite}
.status.processing{background:var(--green-50);color:var(--green-700)}
.status.processing .dot{background:none;border:3px solid var(--green-100);border-top-color:var(--green);animation:spin .9s linear infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(245,197,66,.7)}100%{box-shadow:0 0 0 14px rgba(245,197,66,0)}}
.pay-actions{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap}
.demo-strip{margin-top:16px;border:2px dashed #cdbf9d;border-radius:18px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:15px;color:var(--muted)}
.demo-strip b{color:var(--ink-2);margin-right:4px}
.chip-btn{min-height:44px;padding:0 16px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);font-weight:700;font-size:15px;color:var(--ink)}
.chip-btn.ok{color:var(--green-700)}
.chip-btn.bad{color:var(--red)}
@media (max-width:900px){
  .pay-inner{grid-template-columns:1fr;gap:6px;padding:16px 16px 24px;align-content:start}
  .reader-stage{max-height:none;aspect-ratio:auto;height:250px}
  .reader{width:auto;height:250px}
  .pay h1{font-size:32px}
  .amount{font-size:58px}
  .steps-list li{font-size:17px}
  .steps-list .num{width:36px;height:36px;font-size:16px}
}

/* ---------- Declined ---------- */
.center-screen{flex:1;overflow:auto;display:grid;place-items:center;padding:32px 20px;text-align:center}
.center-card{max-width:640px}
.bigicon{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;margin:0 auto 22px}
.bigicon .ic{width:58px;height:58px;stroke-width:2.6}
.bigicon.bad{background:var(--red-50);color:var(--red)}
.center-card .lead{margin-top:14px}
.center-actions{display:flex;gap:14px;justify-content:center;margin-top:32px;flex-wrap:wrap}

/* ---------- Paid ---------- */
.paid{flex:1;overflow:auto}
.paid-inner{max-width:1180px;margin:0 auto;padding:24px 32px 32px;display:grid;
  grid-template-columns:minmax(280px,.85fr) minmax(0,1.15fr);grid-template-areas:"banner banner" "receipt form";gap:22px 44px;align-items:start}
.banner{grid-area:banner;display:flex;align-items:center;gap:20px}
.check{width:80px;height:80px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff;flex:none;animation:pop .5s .1s both}
.check .ic{width:44px;height:44px;stroke-width:3.2}
.check .ic path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s .35s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.banner h1{font:800 46px/1.02 var(--font-display);letter-spacing:-.025em}
.banner p{font-size:20px;color:var(--ink-2);margin-top:4px}
.receiptcol{grid-area:receipt;display:flex;flex-direction:column;align-items:center}
.receiptcol h2{font:800 26px/1.1 var(--font-display);letter-spacing:-.015em;align-self:stretch;text-align:center}
.print-status{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 16px;font-weight:700;font-size:17px;color:var(--ink-2);min-height:28px;text-align:left}
.print-status .ic{width:22px;height:22px;flex:none}
.print-status.ok{color:var(--green-700)}
.print-status.warn{color:#8a4b00}
.print-status .spinner{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:spin .9s linear infinite;flex:none}
.printer{width:316px;max-width:100%;height:44px;border-radius:16px 16px 8px 8px;background:linear-gradient(#3a352f,#24211d);position:relative;box-shadow:0 10px 20px -10px rgba(0,0,0,.5)}
.printer::before{content:"";position:absolute;left:16px;top:13px;width:8px;height:8px;border-radius:50%;background:#7bd389;box-shadow:0 0 8px #7bd389}
.printer::after{content:"";position:absolute;left:24px;right:24px;bottom:7px;height:7px;border-radius:4px;background:#0c0b09}
.paper-clip{width:280px;max-width:92%;overflow:hidden;margin-top:-10px;padding:0 6px 18px;position:relative}
.paper{position:relative;background:#fff;padding:18px 14px 14px;box-shadow:0 8px 18px -10px rgba(0,0,0,.35);clip-path:inset(0 0 100% 0);animation:printout 3s steps(40,end) .5s forwards}
.paper::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;
  background:linear-gradient(135deg,#fff 5px,transparent 0) 0 0/10px 10px repeat-x,linear-gradient(-135deg,#fff 5px,transparent 0) 0 0/10px 10px repeat-x}
@keyframes printout{to{clip-path:inset(-20px -20px -30px -20px)}}
.rc{font:500 11.4px/1.42 var(--mono);color:#1e1e1e;width:32ch;margin:0 auto;white-space:pre}
.rc .c{text-align:center}
.rc .b{font-weight:800}
.rc .big{font-size:2em;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.rc .tall{padding:.45em 0}
.rc .tall span{display:inline-block;transform:scaleY(1.9)}
.rc .gap{height:1.42em}
.rc img{width:83.3%;margin:0 auto 6px;image-rendering:pixelated}
.formcard{grid-area:form;background:var(--cheese-50);border:3px solid var(--cheese);border-radius:30px;padding:28px 28px 26px;position:relative}
.formcard .kicker{color:#7a5d00}
.formcard h2{font:800 40px/1.04 var(--font-display);letter-spacing:-.025em;margin-top:8px}
.formcard>p{font-size:20px;color:var(--ink-2);margin-top:8px}
.form-mock{margin-top:18px;background:#fff;border-radius:20px;padding:4px 22px;box-shadow:inset 0 0 0 2px #efe0b0}
.form-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:18px 0;border-top:2px dashed #f0e5c2}
.form-row:first-child{border-top:0}
.form-n{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:19px;display:grid;place-items:center}
.form-label{font-size:15px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.form-value{font:800 58px/1 var(--font-display);letter-spacing:-.03em;margin-top:2px}
.form-help{font-size:16px;color:var(--muted);margin-top:2px}
.sign{position:relative;height:62px;border-bottom:3px solid var(--ink);margin-top:2px}
.sign svg{position:absolute;left:4px;bottom:4px;height:52px;width:auto;stroke:var(--ink);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.sign svg path{stroke-dasharray:420;stroke-dashoffset:420;animation:sign 2.2s 1.2s ease-in-out forwards}
@keyframes sign{to{stroke-dashoffset:0}}
.sign .pen{position:absolute;right:2px;bottom:8px;width:34px;height:34px;color:var(--muted)}
.formcard .btn{margin-top:22px}
.formcard .help{margin-top:12px;text-align:center;color:var(--muted);font-size:16px}
@media (max-width:900px){
  .paid-inner{grid-template-columns:1fr;grid-template-areas:"banner" "form" "receipt";padding:16px 14px 28px;gap:18px}
  .banner{gap:14px}
  .check{width:60px;height:60px}.check .ic{width:34px;height:34px}
  .banner h1{font-size:32px}.banner p{font-size:17px}
  .formcard{padding:20px 18px}
  .formcard h2{font-size:30px}
  .formcard>p{font-size:17px}
  .form-mock{padding:2px 14px}
  .form-value{font-size:46px}
}

/* ---------- Thanks ---------- */
.thanks{flex:1;overflow:auto;position:relative}
.thanks-inner{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px}
.thanks-logo{width:min(320px,62vw);height:auto;margin:0 auto}
.thanks h1{font:800 clamp(52px,8vw,84px)/1 var(--font-display);letter-spacing:-.035em;margin-top:18px}
.thanks .lead{margin-top:10px}
.orderno{display:inline-flex;flex-direction:column;background:#fff;border-radius:24px;padding:16px 40px 18px;box-shadow:var(--shadow);margin:24px 0 0}
.orderno small{font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:14px}
.orderno strong{font:800 58px/1 var(--font-display);color:var(--green-700);letter-spacing:-.02em;margin-top:4px}
.countdown{width:min(340px,80vw);height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:34px auto 10px}
.countdown i{display:block;height:100%;background:var(--green);transform-origin:left;animation:countdown linear forwards}
@keyframes countdown{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.countdown-label{color:var(--muted);font-size:16px;font-weight:600}
.thanks .btn{margin-top:22px}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(28,25,21,.56);animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:30px;padding:32px;width:min(600px,100%);max-height:calc(100dvh - 40px);overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:modal-in .3s cubic-bezier(.2,.8,.2,1)}
@keyframes modal-in{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.modal h2{font:800 36px/1.05 var(--font-display);letter-spacing:-.02em}
.modal>p{font-size:19px;color:var(--ink-2);margin-top:10px}
.modal-actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.modal-actions .btn{flex:1 1 200px}
.upsell-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.upsell-grid .pcard{box-shadow:inset 0 0 0 2px var(--line)}
.upsell-grid .pcard.in-cart{box-shadow:none}
.idle-count{font:800 64px/1 var(--font-display);color:var(--green-700);margin-top:16px}
.overlay.side{place-items:stretch end;padding:0}
.drawer{width:min(470px,100%);height:100%;background:#fff;overflow:auto;padding:24px 24px 32px;animation:drawer-in .28s cubic-bezier(.2,.8,.2,1);user-select:text;-webkit-user-select:text}
@keyframes drawer-in{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.drawer h2{font:800 30px/1.1 var(--font-display)}
.sec{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.sec h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.sec p{font-size:16px;color:var(--ink-2);margin-top:8px;line-height:1.45}
.sec .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.sec .btn{min-height:50px;font-size:16px;padding:0 18px}
.pstat{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:700}
.pstat .dot{width:12px;height:12px;border-radius:50%;background:#c9bfae;flex:none}
.pstat .dot.on{background:var(--green)}
.pstat .dot.bad{background:var(--red)}
.seg{display:inline-flex;background:var(--canvas);border-radius:999px;padding:4px;margin-top:12px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{min-height:42px;padding:0 16px;border-radius:999px;font-weight:700;font-size:15px;color:var(--ink-2)}
.asm-cat{margin-top:14px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.asm-row{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:58px}
.asm-cat>.asm-row{background:var(--canvas);font-weight:800;font-size:17px}
.asm-row+.asm-row{border-top:1px solid var(--line)}
.asm-row .nm{flex:1;min-width:0}
.asm-row .nm small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.asm-cat.off .asm-prod{opacity:.45}
.switch{width:56px;height:32px;border-radius:999px;background:#cfc6b6;position:relative;flex:none;transition:background-color .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(24px)}
.asm-foot{position:sticky;bottom:-32px;background:#fff;padding:14px 0 6px;margin-top:16px;display:flex;gap:10px;border-top:1px solid var(--line)}
.asm-foot .btn{flex:1;min-height:52px;font-size:17px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px -2px rgba(0,0,0,.25)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--canvas);border-radius:16px;padding:12px 14px}
.stat small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.stat b{font:800 26px var(--font-display)}
.note{font-size:14px;color:var(--muted);margin-top:10px;line-height:1.45}
.err{background:var(--red-50);color:var(--red);border-radius:14px;padding:10px 14px;font-size:15px;font-weight:600;margin-top:10px}
.field{display:grid;gap:6px;margin-top:12px;font-size:14px;font-weight:700;color:var(--ink-2)}
.field input,.field select{min-height:50px;border-radius:14px;border:1px solid var(--line);padding:0 14px;font:500 16px var(--font);background:#fff;color:var(--ink);width:100%}
.field input:focus,.field select:focus{outline:3px solid var(--cheese);border-color:transparent}
.ok-note{background:var(--green-50);color:var(--green-700);border-radius:14px;padding:10px 14px;font-size:15px;font-weight:600;margin-top:10px}
.closed{margin-top:30px;background:#fff;border-radius:24px;padding:18px 26px;box-shadow:var(--shadow);font-weight:700;font-size:20px;max-width:620px}
.pin-dots{display:flex;gap:16px;justify-content:center;margin:22px 0}
.pin-dots i{width:20px;height:20px;border-radius:50%;background:var(--line)}
.pin-dots i.on{background:var(--ink)}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.keypad button{height:72px;border-radius:20px;background:var(--canvas);font:800 28px var(--font);box-shadow:inset 0 0 0 1px var(--line)}
.keypad button:active{background:var(--line)}
.keypad .ic{width:28px;height:28px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .paper{animation:none;clip-path:none}
}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="overlay-root"></div>
<div id="announcer" class="sr" aria-live="assertive"></div>

<script src="assets/receipt-logo.js"></script>
<script>
(() => {
'use strict';

/* ==========================================================================
   Config & catalogue
   Prices are the hand-set USD amounts from the "USD @ 0.90" price profile in
   backend/scripts/seed-price-profiles.ts. In the real build the kiosk would
   read GET /events/:id/prices instead of this list.
   ========================================================================== */
// Live when served by the kiosk server and it reports POS + SumUp ready;
// demo (payments simulated, demo controls visible) otherwise, or when staff
// switch the kiosk to demo in the staff panel.
const isLive = () => settings.mode !== 'demo' && live.ready;
const isDemo = () => !isLive();
const DEMO_RATE = 0.9;                // demo only: stands in for the day's USD→EUR settlement rate
const STAFF_PIN = '1234';
const IDLE_WARN_SECONDS = 60;
const IDLE_RESET_SECONDS = 20;
const THANKS_SECONDS = 12;
const DEAL_EVERY = 3;                 // every 3 cheeses = 1 free mustard

const LOGO_SRC = 'assets/logo.webp';
const LOGO_MONO_SRC = 'assets/receipt-logo.png';
const LOGO_RASTER = window.RECEIPT_LOGO;  // 1-bit, MSB first, for ESC/POS "GS v 0" (assets/receipt-logo.js)

let CATEGORIES = [
  { id:'cheese',  label:'Cheese',          title:'Dutch cheese',        sub:'Freshly cut pieces from our market stall.', tint:'#fff3c9', art:{ kind:'wedge', body:'#f5cf62', rind:'#d9971f' } },
  { id:'whole',   label:'Whole cheeses',   title:'Whole cheeses',       sub:'A full wheel to take home or share.',        tint:'#fdebc8', art:{ kind:'wheel', rind:'#e0a336' } },
  { id:'mustard', label:'Mustard',         title:'Mustard',             sub:'The perfect partner for a slice of Gouda.', tint:'#fbefc2', art:{ kind:'jar', fill:'#d9a514', lid:'#2a8f33' } },
  { id:'sweets',  label:'Cookies & sweets',title:'Cookies & sweets',    sub:'A little Dutch treat for the road.',         tint:'#f9e6d6', art:{ kind:'stroopwafel' } },
  { id:'gifts',   label:'Souvenirs',       title:'Souvenirs',           sub:'Something to remember Holland by.',          tint:'#e8f3e5', art:{ kind:'clogs' } },
  { id:'extras',  label:'Extras',          title:'Extras',              sub:'Anything else you might need.',              tint:'#ecebe6', art:{ kind:'bag' } },
];

let PRODUCTS = [
  { id:'gouda-young',  cat:'cheese',  name:'Young Gouda',            desc:'Mild, creamy and soft.',                       price:11,  art:{ kind:'wedge', body:'#fbe7a1', rind:'#f0c44a' } },
  { id:'gouda-mature', cat:'cheese',  name:'Mature Gouda',           desc:'A fuller flavour, still smooth.',              price:13,  art:{ kind:'wedge', body:'#f7d774', rind:'#e2ad33' } },
  { id:'gouda-aged',   cat:'cheese',  name:'Aged Gouda',             desc:'Rich and nutty, with crunchy crystals.',       price:14,  art:{ kind:'wedge', body:'#efbd48', rind:'#b97716' } },
  { id:'truffle',      cat:'cheese',  name:'Truffle Cheese',         desc:'Creamy Gouda with black truffle.',             price:17,  art:{ kind:'wedge', body:'#f6df94', rind:'#3a3631', specks:true } },
  { id:'goat',         cat:'cheese',  name:'Goat Cheese',            desc:'Fresh, light and slightly tangy.',             price:15,  art:{ kind:'wedge', body:'#fbf7ea', rind:'#e3dac2', holes:false } },
  { id:'whole-aged',   cat:'whole',   name:'Whole Aged Gouda',       desc:'A full wheel of about 12 kg (26 lb).',         price:160, max:4, art:{ kind:'wheel', rind:'#d48f22' } },
  { id:'whole-farm',   cat:'whole',   name:'Whole Farmhouse Cheese', desc:'A full wheel of about 10 kg (22 lb).',         price:140, max:4, art:{ kind:'wheel', rind:'#e9b94c' } },

function totals() {
  const lines = [];
  let subtotal = 0, count = 0, cheeseQty = 0;
  const mustardUnits = [];
  for (const [id, qty] of state.cart) {
    const p = byId[id];
    lines.push({ id, name: p.name, price: p.price, qty, total: p.price * qty, cat: p.cat });
    subtotal += p.price * qty; count += qty;
    if (p.cat === 'cheese') cheeseQty += qty;
    if (p.cat === 'mustard') for (let i = 0; i < qty; i++) mustardUnits.push({ id, price: p.price });
  }
  // "Buy 3 cheeses, get a mustard free": the cheapest mustard units go free.
  // Demo catalogue only.
  const earned = isDemo() ? Math.floor(cheeseQty / DEAL_EVERY) : 0;
  mustardUnits.sort((a, b) => a.price - b.price);
  const freeUnits = mustardUnits.slice(0, earned);
  const discount = freeUnits.reduce((s, u) => s + u.price, 0);
  const freeById = {};
  for (const u of freeUnits) freeById[u.id] = (freeById[u.id] || 0) + 1;
  const total = round2(subtotal - discount);
  return { lines, subtotal, discount, total, chargeEur: toEur(total), count, cheeseQty: isDemo() ? cheeseQty : 0, earned, free: freeUnits.length, missing: earned - freeUnits.length, freeById };
}

function setQty(id, q) {
  const max = byId[id].max || 20;
  q = Math.max(0, Math.min(max, q));
  if (q) state.cart.set(id, q); else state.cart.delete(id);
  if (state.screen === 'menu') { refreshProduct(id); renderOrderbar(); renderRail(); }
  if (state.screen === 'review') renderReview();
  if ($('.upsell-grid')) refreshProduct(id);
}
function addItem(id, sourceEl) {
  const before = qtyOf(id);
  if (before >= (byId[id].max || 20)) return;
  setQty(id, before + 1);
  flyToBag(sourceEl);
  announce(`${byId[id].name} added. ${totals().count} items in your order.`);
}
function flyToBag(sourceEl) {
  const bag = $('#bag');
  const card = sourceEl && sourceEl.closest('.pcard');
  const svg = card && card.querySelector('.pcard-art svg');
  if (!bag) return;
  const bump = () => { bag.classList.remove('bump'); void bag.offsetWidth; bag.classList.add('bump'); };
  if (!svg || reduceMotion() || !svg.animate) { bump(); return; }
  const from = svg.getBoundingClientRect(), to = bag.getBoundingClientRect();
  const fly = svg.cloneNode(true);
  fly.classList.add('flyer');
  Object.assign(fly.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' });
  document.body.appendChild(fly);
  const dx = to.left + to.width / 2 - (from.left + from.width / 2);
  const dy = to.top + to.height / 2 - (from.top + from.height / 2);
  fly.animate([
    { transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: `translate(${dx * .45}px, ${dy * .45 - 60}px) scale(.6)`, opacity: 1, offset: .5 },
    { transform: `translate(${dx}px, ${dy}px) scale(.16)`, opacity: .3 },
  ], { duration: 620, easing: 'cubic-bezier(.45,.05,.4,1)' }).onfinish = () => { fly.remove(); bump(); };
}

/* ==========================================================================
   Live mode — this kiosk's own server (src/ in this repo)
   The page never talks to SumUp or to the POS directly and holds no
   secrets. The kiosk server prices the order from the POS price list,
   records the sale in the POS, puts the amount on the SumUp Solo and reports
   back what SumUp says. Opened as a plain file (no server) the kiosk runs in
   demo mode.
   ========================================================================== */
const live = { ready: false, status: null, error: '', order: null };

async function api(method, path, body, extraHeaders = {}) {
  let res;
  try {
    res = await fetch('api' + path, {
      method,
      headers: { 'content-type': 'application/json', ...(settings.kioskKey ? { 'x-kiosk-key': settings.kioskKey } : {}), ...extraHeaders },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch {
    const err = new Error('The kiosk server cannot be reached.');
    err.status = 0;
    throw err;
  }
  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch { /* not JSON */ }
  if (!res.ok) {
    const err = new Error((json && json.error) || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  return json;
}
const hasServer = () => location.protocol === 'http:' || location.protocol === 'https:';

function artFor(category, name) {
  const t = ((category || '') + ' ' + (name || '')).toLowerCase();
  if (/hele|whole|wiel|wheel/.test(t)) return { kind: 'wheel', rind: /boer|farm/.test(t) ? '#e9b94c' : '#d48f22' };
  if (/mosterd|mustard/.test(t)) return { kind: 'jar', fill: /honing|honey/.test(t) ? '#e6b53a' : '#c99a12', lid: /honing|honey/.test(t) ? '#1c1915' : '#2a8f33', grain: /grof|coarse/.test(t) };
  if (/specul/.test(t)) return { kind: 'speculaas' };
  if (/koek|cookie|stroop|wafel|sweet/.test(t)) return { kind: 'stroopwafel' };
  if (/souvenir|klomp|clog/.test(t)) return { kind: 'clogs' };
  if (/kaas|cheese|gouda|geit|goat|truffel|truffle/.test(t)) {
    if (/truffel|truffle/.test(t)) return { kind: 'wedge', body: '#f6df94', rind: '#3a3631', specks: true };
    if (/geit|goat/.test(t)) return { kind: 'wedge', body: '#fbf7ea', rind: '#e3dac2', holes: false };
    if (/oud|aged|old/.test(t)) return { kind: 'wedge', body: '#efbd48', rind: '#b97716' };
    if (/belegen|mature/.test(t)) return { kind: 'wedge', body: '#f7d774', rind: '#e2ad33' };
    return { kind: 'wedge', body: '#fbe7a1', rind: '#f0c44a' };
  }
  return { kind: 'bag' };
}
const TINTS = ['#fff3c9', '#fdebc8', '#fbefc2', '#f9e6d6', '#e8f3e5', '#ecebe6'];
// The POS's category names are Dutch; the kiosk speaks English.
const CATEGORY_NAMES = { kaas: 'Cheese', hele_kaas: 'Whole cheeses', koek: 'Cookies & sweets', mosterd: 'Mustard', souvenir: 'Souvenirs', overig: 'Extras' };
const categoryLabel = name => CATEGORY_NAMES[(name || '').toLowerCase()] || (name || '').replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());

function useDemoCatalogue() {
  CATEGORIES = DEMO_CATALOGUE.categories; PRODUCTS = DEMO_CATALOGUE.products;
  currency = 'USD'; dayRate = DEMO_RATE;
  indexCatalogue();

// Live when the kiosk server says it is ready (POS + SumUp) and staff did not
// switch the kiosk to demo; otherwise the demo catalogue.
async function applyCatalogue() {
  live.ready = false;
  if (!hasServer() || settings.mode === 'demo') { useDemoCatalogue(); return; }
  try {
    live.status = await api('GET', '/status');
    // A kiosk server without a POS behind it (someone trying it out): demo.
    if (!live.status.pos.configured) { useDemoCatalogue(); return; }
    if (!live.status.live) throw new Error(live.status.pos.ok ? 'The card reader is not set up on the kiosk server.' : live.status.pos.error);
    const c = await api('GET', '/catalogue');
    const cats = new Map();
    for (const p of c.products) {
      if (!cats.has(p.category_id)) cats.set(p.category_id, { id: p.category_id, label: categoryLabel(p.category), title: categoryLabel(p.category), sub: '', tint: TINTS[cats.size % TINTS.length], art: artFor(p.category, p.name) });
    }
    if (!c.products.length) throw new Error('The price list of this event is empty.');
    CATEGORIES = [...cats.values()];
    PRODUCTS = c.products.map(p => ({ id: p.id, cat: p.category_id, name: p.name, desc: '', price: p.price, art: artFor(p.category, p.name) }));
    currency = c.currency; dayRate = c.rate;
    indexCatalogue();
    live.ready = true; live.error = '';
  } catch (err) {
    live.error = err.message;
    if (err.status === 0 || err.status === 404 || err.status === 401) {
      // No kiosk server here (or not ours): just the demo.
      useDemoCatalogue();
      if (err.status !== 401) live.error = '';
      return;
    }
    CATEGORIES = []; PRODUCTS = []; indexCatalogue();
  }
  state.cart.clear();
  state.cat = CATEGORIES[0] ? CATEGORIES[0].id : null;
}

function liveStatusHtml() {
  const s = live.status;
  if (!hasServer()) return '<p class="note">Opened as a file: demo only. Run the kiosk server to sell for real.</p>';
  if (!s) return `${live.error ? `<div class="err">${esc(live.error)}</div>` : '<p class="note">No kiosk server answered: demo only.</p>'}`;
  const r = s.sumup.reader;

    : `${esc(r.name || r.id)} — ${esc(r.status || 'UNKNOWN')}${r.battery_level != null ? ', battery ' + Math.round(r.battery_level) + '%' : ''}${s.sumup.mock ? ' (virtual)' : ''}`;
  return `

    ${live.ready && settings.mode !== 'demo' ? '<div class="ok-note">Live: real prices, real card payments.</div>' : ''}
    <div class="row"><button class="btn btn-secondary" data-action="live-refresh">Check again</button></div>`;
}

const cartLines = () => [...state.cart].map(([product_id, qty]) => ({ product_id, qty }));

async function startLivePayment() {
  const attempt = state.pay;
  setPayStatus('starting');
  try {
    const order = await api('POST', '/orders', { lines: cartLines() });
    if (state.pay !== attempt) return;
    live.order = order;
    showChargeAmount(order.amount_eur);
    setPayStatus('waiting');
    pollLive(attempt);
  } catch (err) {
    if (state.pay !== attempt) return;
    state.declineDetail = err.message;
    paymentResult('unavailable');
  }
}

function pollLive(attempt) {
  const tick = async () => {
    if (state.pay !== attempt || state.screen !== 'pay' || !live.order) return;
    try {
      const o = await api('POST', `/orders/${live.order.id}/poll`);
      if (state.pay !== attempt) return;
      live.order = o;
      if (o.state === 'paid') { paymentResult('approved'); return; }
      if (o.state === 'failed') { paymentResult(o.failure === 'timeout' ? 'timeout' : 'declined'); return; }
      if (o.state === 'stuck') { paymentResult('stuck'); return; }
      const device = o.reader || {};
      if (device.status === 'OFFLINE') setPayStatus('connection');
      else if (device.state === 'WAITING_FOR_PIN') setPayStatus('pin');
      else if (device.state === 'WAITING_FOR_SIGNATURE') setPayStatus('processing');
      else if (device.state === 'WAITING_FOR_CARD') setPayStatus('waiting');
      else if (state.pay.status === 'connection') setPayStatus('waiting');
    } catch {
      if (state.pay === attempt) setPayStatus('connection');
    }
    payTimers.push(setTimeout(tick, 2000));
  };
  payTimers.push(setTimeout(tick, 1500));
}

async function cancelLivePayment() {
  const attempt = state.pay;
  clearPayTimers();
  setPayStatus('cancelling');
  try {
    const o = await api('POST', `/orders/${live.order.id}/cancel`);
    if (state.pay !== attempt) return;
    live.order = o;
    if (o.state === 'paid') { paymentResult('approved'); return; }
    if (o.state === 'failed') {
      live.order = null;
      goto('review');
      announce('Payment cancelled. Nothing has been charged.');
      return;
    }
    paymentResult('stuck');
  } catch (err) {
    if (state.pay !== attempt) return;
    state.declineDetail = err.message;
    paymentResult('stuck');
  }
}

   Payment — demo: a simulated card reader (live mode branches off above)
   ========================================================================== */
let payTimers = [];
function clearPayTimers() { payTimers.forEach(clearTimeout); payTimers = []; }
function startPayment() {
  clearPayTimers();
  state.pay = { status: 'waiting', startedAt: Date.now() };
  if (isLive()) { startLivePayment(); return; }
  if (settings.autoTap) payTimers.push(setTimeout(simTap, 5000));
  payTimers.push(setTimeout(() => { if (state.screen === 'pay' && state.pay.status === 'waiting') paymentResult('timeout'); }, 90000));
}
function simTap(forced) {
  if (state.screen !== 'pay' || state.pay.status !== 'waiting') return;
  setPayStatus('processing');
  const outcome = forced || (settings.outcome === 'decline' ? 'declined' : 'approved');
  payTimers.push(setTimeout(() => paymentResult(outcome), 2400));
}
function paymentResult(result) {
  clearPayTimers();
  if (state.screen !== 'pay') return;
  if (result === 'approved') completeOrder();
  else { state.declineReason = result; goto('declined'); }
}
function cancelPayment() {
  if (isLive() && live.order) { cancelLivePayment(); return; }

}

function fakeCardPayment() {
  const rnd = (chars, n) => Array.from({ length: n }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
  return {
    brand: ['VISA', 'MASTERCARD', 'VISA', 'AMEX'][Math.floor(Math.random() * 4)],
    last4: rnd('0123456789', 4),
    entry: 'Contactless',
    auth: rnd('0123456789ABCDEF', 6),
    ref: 'TX' + rnd('ABCDEFGHJKLMNPQRSTUVWXYZ23456789', 8),

}
// Card details SumUp returned for this payment, when it returned them.
function livePayment(o) {
  if (!o || !o.card || !o.card.last4) return null;
  return { brand: o.card.type || 'CARD', last4: o.card.last4, entry: 'Card', auth: o.card.code || '-', ref: o.reference };
}
function completeOrder() {
  const t = totals();
  const order = {
    no: nextOrderNo(),
    createdAt: new Date(),
    lines: t.lines.map(l => ({ ...l, free: t.freeById[l.id] || 0 })),
    subtotal: t.subtotal, discount: t.discount, total: t.total, count: t.count,
    currency, rate: dayRate,
    chargeEur: isLive() && live.order ? live.order.amount_eur : t.chargeEur,
    demo: isDemo(),
    ref: isLive() && live.order ? live.order.reference : null,
    payment: isDemo() ? fakeCardPayment() : livePayment(live.order),
  };
  live.order = null;
  state.order = order;
  const day = store.get('olga-kiosk-day', { date: todayKey(), orders: [] });
  const orders = day.date === todayKey() ? day.orders : [];
  orders.push({ no: order.no, total: order.chargeEur, at: order.createdAt.toISOString() });
  store.set('olga-kiosk-day', { date: todayKey(), orders });
  state.cart.clear();
  state.print = { status: 'printing', error: '' };
  goto('paid');
  printOrderReceipt(order);   // straight away, no dialog
}

/* ==========================================================================
   Receipt: one description, two renderers (ESC/POS bytes and on-screen)
   ========================================================================== */
const COLS = 32; // 58 mm paper, font A
function pair(l, r) {
  l = String(l); r = String(r);
  const room = COLS - r.length - 1;
  if (l.length > room) l = l.slice(0, Math.max(0, room - 1)) + '.';
  return l + ' '.repeat(Math.max(1, COLS - l.length - r.length)) + r;
}
function receiptBlocks(o) {
  const d = o.createdAt;
  const date = d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
  const time = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  const B = [];
  if (settings.printLogo) B.push({ t: 'logo' });
  B.push({ t: 'line', s: "OLGA'S CHEESE", a: 'c', big: true });
  B.push({ t: 'line', s: 'Self-service desk', a: 'c' });
  B.push({ t: 'rule' });
  B.push({ t: 'line', s: pair('Order', o.no), b: true });
  B.push({ t: 'line', s: pair('Date', date) });
  B.push({ t: 'line', s: pair('Time', time) });
  B.push({ t: 'rule' });
  for (const l of o.lines) {
    const left = `${l.qty} x ${l.name}`, amt = l.total.toFixed(2);
    if (l.qty > 1) {
      B.push({ t: 'line', s: left.slice(0, COLS) });
      B.push({ t: 'line', s: pair(`    @ ${l.price.toFixed(2)} each`, amt) });
    } else if (left.length + amt.length + 1 <= COLS) {
      B.push({ t: 'line', s: pair(left, amt) });
    } else {
      B.push({ t: 'line', s: left.slice(0, COLS) });
      B.push({ t: 'line', s: pair('', amt) });
    }
  }
  if (o.discount) B.push({ t: 'line', s: pair('Deal: free mustard', '-' + o.discount.toFixed(2)) });
  B.push({ t: 'rule' });
  B.push({ t: 'line', s: pair('TOTAL ' + o.currency, o.total.toFixed(2)), b: true, tall: true });
  B.push({ t: 'rule' });
  B.push({ t: 'line', s: 'PAID BY CARD', b: true });
  B.push({ t: 'line', s: pair('Charged EUR', o.chargeEur.toFixed(2)), b: true });
  if (o.currency !== 'EUR') B.push({ t: 'line', s: pair(`Rate ${o.currency}-EUR`, String(o.rate)) });
  if (o.payment) {
    B.push({ t: 'line', s: pair(o.payment.brand, '**** ' + o.payment.last4) });
    B.push({ t: 'line', s: pair('Entry', o.payment.entry) });
    B.push({ t: 'line', s: pair(o.demo ? 'Auth code' : 'Transaction', o.payment.auth) });
    B.push({ t: 'line', s: pair('Reference', o.payment.ref) });
  } else if (o.ref) {
    B.push({ t: 'line', s: pair('Reference', o.ref) });
  }
  B.push({ t: 'rule' });
  B.push({ t: 'line', s: 'On the paper form, please write:', a: 'c' });
  B.push({ t: 'line', s: pair('  Amount', 'EUR ' + o.chargeEur.toFixed(2) + '  ') });
  B.push({ t: 'line', s: '  + your signature' });
  B.push({ t: 'gap' });
  B.push({ t: 'line', s: 'Thank you! Dank je wel!', a: 'c', b: true });
  if (o.demo) { B.push({ t: 'gap' }); B.push({ t: 'line', s: '*** DEMO - NO CARD CHARGED ***', a: 'c' }); }
  return B;
}
function receiptHtml(blocks) {
  return `<div class="rc">${blocks.map(b => {
    if (b.t === 'logo') return `<img src="${LOGO_MONO_SRC}" alt="">`;
    if (b.t === 'rule') return `<div>${'-'.repeat(COLS)}</div>`;
    if (b.t === 'gap') return '<div class="gap"></div>';
    const cls = [b.a === 'c' ? 'c' : '', b.b ? 'b' : '', b.big ? 'big' : '', b.tall ? 'tall' : ''].join(' ');
    return `<div class="${cls}">${b.tall ? `<span>${esc(b.s)}</span>` : esc(b.s)}</div>`;
  }).join('')}</div>`;
}

class EscPos {
  constructor() { this.parts = []; }
  raw(...b) { this.parts.push(Uint8Array.from(b)); return this; }
  bytes(u8) { this.parts.push(u8); return this; }
  init() { return this.raw(0x1b, 0x40).raw(0x1b, 0x74, 0x00); }      // ESC @ reset, ESC t 0 = PC437
  align(n) { return this.raw(0x1b, 0x61, n); }                       // 0 left, 1 centre, 2 right
  bold(on) { return this.raw(0x1b, 0x45, on ? 1 : 0); }
  size(w, h) { return this.raw(0x1d, 0x21, ((w - 1) << 4) | (h - 1)); }
  text(s) {
    const ascii = s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7e\n]/g, '?');
    return this.bytes(new TextEncoder().encode(ascii));
  }
  line(s = '') { return this.text(s + '\n'); }
  feed(n) { return this.raw(0x1b, 0x64, n); }
  cut() { return this.raw(0x1d, 0x56, 0x42, 0x00); }                // feed + partial cut (ignored if no cutter)
  raster(w, h, data) {                                               // GS v 0
    const bw = w / 8;
    return this.raw(0x1d, 0x76, 0x30, 0x00, bw & 255, bw >> 8, h & 255, h >> 8).bytes(data);
  }
  build() {
    const len = this.parts.reduce((s, p) => s + p.length, 0);
    const out = new Uint8Array(len);
    let o = 0;
    for (const p of this.parts) { out.set(p, o); o += p.length; }
    return out;
  }
}
let logoBytesCache = null;
function logoBytes() {
  if (!logoBytesCache) {
    const bin = atob(LOGO_RASTER.b64);
    logoBytesCache = Uint8Array.from(bin, c => c.charCodeAt(0));
  }
  return logoBytesCache;
}
function escposFromBlocks(blocks) {
  const e = new EscPos().init();
  for (const b of blocks) {
    if (b.t === 'logo') { e.align(1).raster(LOGO_RASTER.w, LOGO_RASTER.h, logoBytes()).line(); continue; }
    if (b.t === 'rule') { e.align(0).line('-'.repeat(COLS)); continue; }
    if (b.t === 'gap') { e.line(); continue; }
    e.align(b.a === 'c' ? 1 : 0);
    if (b.b || b.big) e.bold(true);
    if (b.big) e.size(2, 2); else if (b.tall) e.size(1, 2);
    e.line(b.s);
    if (b.big || b.tall) e.size(1, 1);
    if (b.b || b.big) e.bold(false);
  }
  return e.align(0).feed(4).cut().build();
}

/* ==========================================================================
   Printer — WebUSB, straight to a 58 mm ESC/POS thermal printer.
   requestDevice() needs a tap (staff pairs once); getDevices() afterwards
   returns the paired printer without any gesture, so the kiosk reconnects on
   its own and every receipt prints without a dialog.
   ========================================================================== */
const Printer = {
  device: null, endpoint: null, iface: null, name: '', ready: false, connecting: false, lastError: '',
  support() {
    if (!('usb' in navigator)) return { ok: false, why: 'This browser cannot talk to USB printers. Use Chrome or Edge on an Android tablet, Windows, macOS or ChromeOS (iPad and iPhone do not support this).' };
    if (!window.isSecureContext) return { ok: false, why: 'USB printing needs a secure page (https:// or a local file).' };
    return { ok: true };
  },
  async autoConnect() {
    if (!this.support().ok || this.ready) return;
    try {
      const devices = await navigator.usb.getDevices();
      if (devices.length) await this.open(devices[0]);
    } catch { /* blocked here (e.g. preview frame) or nothing paired yet */ }
  },
  async request() {
    this.lastError = '';
    try {
      const device = await navigator.usb.requestDevice({ filters: [] });
      await this.open(device);
    } catch (err) {
      if (err && err.name === 'NotFoundError') this.lastError = 'No printer selected.';
      else if (err && err.name === 'SecurityError') this.lastError = 'USB is blocked inside this preview window. Download the file and open it directly in Chrome.';
      else this.lastError = 'Could not connect: ' + (err && err.message || err);
    }
    onPrinterChange();
  },
  async open(device) {
    this.connecting = true; onPrinterChange();
    try {
      await device.open();
      if (device.configuration === null) await device.selectConfiguration(1);
      let pick = null;
      for (const iface of device.configuration.interfaces) {
        for (const alt of iface.alternates) {
          const ep = alt.endpoints.find(e => e.direction === 'out' && e.type === 'bulk');
          if (!ep) continue;
          const score = alt.interfaceClass === 7 ? 2 : 1;            // 7 = printer class
          if (!pick || score > pick.score) pick = { iface, alt, ep, score };
        }
      }
      if (!pick) throw new Error('this USB device has no printer output.');
      await device.claimInterface(pick.iface.interfaceNumber);
      if (pick.alt.alternateSetting) await device.selectAlternateInterface(pick.iface.interfaceNumber, pick.alt.alternateSetting);
      Object.assign(this, { device, endpoint: pick.ep.endpointNumber, iface: pick.iface.interfaceNumber, name: device.productName || 'USB receipt printer', ready: true, lastError: '' });
    } catch (err) {
      await device.close().catch(() => {});
      this.ready = false;
      this.lastError = 'Could not connect: ' + (err && err.message || err);
    } finally {
      this.connecting = false; onPrinterChange();
    }
  },
  async write(bytes) {
    if (!this.ready) throw new Error('no printer connected');
    try {
      for (let i = 0; i < bytes.length; i += 2048) {
        const r = await this.device.transferOut(this.endpoint, bytes.subarray(i, i + 2048));
        if (r.status !== 'ok') throw new Error('printer answered "' + r.status + '"');
      }
    } catch (err) {
      this.ready = false; this.device = null;
      this.lastError = 'Printing failed: ' + (err && err.message || err);
      onPrinterChange();
      throw err;
    }
  },
  async disconnect() {
    const d = this.device;
    Object.assign(this, { device: null, ready: false, name: '' });
    if (d) await d.close().catch(() => {});
    onPrinterChange();
  },
};
function onPrinterChange() {
  refreshStaff();
  $$('.demo-btn .dot').forEach(d => d.classList.toggle('on', Printer.ready));
}
if ('usb' in navigator) {
  try {
    navigator.usb.addEventListener('disconnect', e => { if (e.device === Printer.device) { Printer.ready = false; Printer.device = null; onPrinterChange(); } });
    navigator.usb.addEventListener('connect', () => Printer.autoConnect());
  } catch { /* ignore */ }
}

async function printOrderReceipt(order) {
  state.print = { status: 'printing', error: '' };
  renderPrintStatus();
  const minShow = delay(reduceMotion() ? 300 : 3200);   // let the paper animation finish
  if (!Printer.ready) await Printer.autoConnect();
  if (!Printer.ready) {
    await minShow;
    state.print = { status: isDemo() ? 'demo' : 'error', error: '' };
    renderPrintStatus();
    return;
  }
  try {
    await Promise.all([Printer.write(escposFromBlocks(receiptBlocks(order))), minShow]);
    state.print = { status: 'printed', error: '' };
  } catch (err) {
    await minShow;
    state.print = { status: 'error', error: String(err && err.message || err) };
  }
  if (state.order === order) renderPrintStatus();
}
async function printTest() {
  const test = {
    no: 'TEST', createdAt: new Date(), discount: 0, total: 0, count: 0,
    currency: 'EUR', rate: 1, chargeEur: 0, demo: true, ref: 'TEST',
    lines: [{ qty: 1, name: 'Printer test', price: 0, total: 0 }],
    payment: { brand: 'TEST', last4: '0000', entry: '-', auth: '-', ref: '-' },
  };
  try { await Printer.write(escposFromBlocks(receiptBlocks(test))); } catch { /* shown in panel */ }
}

/* ==========================================================================
   Events
   ========================================================================== */
const actions = {
  start: () => goto('menu'),
  cat: el => {
    state.cat = el.dataset.cat;
    if (state.screen !== 'menu') goto('menu');
    else { renderRail(); renderCategory(); renderOrderbar(); }
  },
  add: el => addItem(el.dataset.id, el),
  inc: el => setQty(el.dataset.id, qtyOf(el.dataset.id) + 1),
  dec: el => setQty(el.dataset.id, qtyOf(el.dataset.id) - 1),
  remove: el => setQty(el.dataset.id, 0),
  review: () => {
    const hasSweets = [...state.cart.keys()].some(id => isSweet(byId[id]));
    if (!hasSweets && !state.upsellShown && PRODUCTS.some(isSweet)) openUpsell(); else goto('review');
  },
  'upsell-continue': () => goto('review'),
  'pick-mustard': () => { state.cat = 'mustard'; goto('menu'); },
  'back-menu': () => goto('menu'),
  'back-review': () => { live.order = null; goto('review'); },
  pay: () => goto('pay'),
  'cancel-pay': cancelPayment,
  'sim-tap': () => simTap(),
  'sim-approve': () => { if (state.pay && state.pay.status === 'waiting') simTap('approved'); else paymentResult('approved'); },
  'sim-decline': () => { if (state.pay && state.pay.status === 'waiting') simTap('declined'); else paymentResult('declined'); },
  done: () => goto('thanks'),
  'new-order': resetAll,
  'start-over': () => { if (state.cart.size) confirmStartOver(); else resetAll(); },
  'modal-close': closeModal,
  'logo-tap': logoTap,
  'pin-key': el => pinKey(el.dataset.key),
  'open-staff': openStaff,
  'printer-connect': () => Printer.request(),
  'printer-test': () => printTest(),
  'printer-disconnect': () => Printer.disconnect(),
  'reset-day': () => { store.set('olga-kiosk-day', { date: todayKey(), orders: [] }); store.set('olga-kiosk-counter', { date: todayKey(), n: 0 }); refreshStaff(); },
  set: el => {
    const k = el.dataset.key, v = el.dataset.val;
    settings[k] = k === 'outcome' || k === 'mode' ? v : v === '1';
    saveSettings();
    if (k === 'mode') { applyCatalogue().then(() => { refreshStaff(); if (state.screen === 'welcome') renderWelcome(); }); }
    refreshStaff();
  },
  'asm-open': () => openAssortment(),
  'asm-cat': el => toggleIn(asm.offCats, el.dataset.id),
  'asm-prod': el => toggleIn(asm.offProds, el.dataset.id),
  'asm-save': () => saveAssortment(),
  'asm-back': () => { asm.data = null; refreshStaff(); },
  'live-refresh': () => applyCatalogue().then(() => { refreshStaff(); if (state.screen === 'welcome') renderWelcome(); }),
};
document.addEventListener('click', e => {
  const overlay = e.target.closest('.overlay');
  if (overlay && e.target === overlay && modalKind !== 'idle') { closeModal(); return; }
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) { e.stopPropagation(); fn(el, e); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalKind && modalKind !== 'idle') closeModal(); });
document.addEventListener('contextmenu', e => e.preventDefault());

/* Idle handling: a kiosk must never stay stuck on someone else's order. */
let lastActivity = Date.now();
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { lastActivity = Date.now(); }, { capture: true, passive: true }));
setInterval(() => {
  const idle = (Date.now() - lastActivity) / 1000;
  if ((state.screen === 'menu' || state.screen === 'review') && state.cart.size && !modalKind && idle > IDLE_WARN_SECONDS) openIdle();
  else if ((state.screen === 'menu' || state.screen === 'review') && !state.cart.size && !modalKind && idle > IDLE_WARN_SECONDS) resetAll();
  else if (state.screen === 'declined' && idle > 60) resetAll();
  else if (state.screen === 'paid' && idle > 180) goto('thanks');
}, 1000);

/* Boot */
renderWelcome();
applyCatalogue().then(() => { if (state.screen === 'welcome') renderWelcome(); });
Printer.autoConnect();
})();
</script>
