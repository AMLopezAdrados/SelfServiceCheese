# /etc/nginx/sites-available/olgas-kiosk
# The kiosk server serves both the page and its API; nginx only adds HTTPS.
server {
    server_name kiosk.olgascheese.net;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # "Cancel payment" waits up to ~15 s for SumUp to confirm.
        proxy_read_timeout 60s;
    }

    listen 80;
}
